  on:
    push:
      branches: [ main ]

  env:
    AWS_REGION : "eu-west-1"
    ECR_NAMESPACE: "kekwarriors"
    ECR_REPOSITORY: "backend"

  permissions:
    id-token: write
    contents: read
  jobs:
    DeployToEC2:
      runs-on: ubuntu-latest
      steps:
        - name: Git clone the repository
          uses: actions/checkout@v6

        - name: configure aws credentials
          uses: aws-actions/configure-aws-credentials@v6.0.0
          with:
            role-to-assume: "arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHub"
            role-session-name: GitHub_to_AWS_via_FederatedOIDC
            aws-region: "eu-west-1"

        - name: Login to Amazon ECR
          id: login-ecr
          uses: aws-actions/amazon-ecr-login@v2

        - name: Build, tag and push to Amazon ECR
          id: build-image
          env:
            ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
            IMAGE_TAG: ${{ github.sha }}
          run: |
            docker build -t $ECR_REGISTRY/$ECR_NAMESPACE/$ECR_REPOSITORY:latest .
            docker push $ECR_REGISTRY/$ECR_NAMESPACE/$ECR_REPOSITORY:latest
            echo "image=$ECR_REGISTRY/$ECR_NAMESPACE/$ECR_REPOSITORY:latest" >> $GITHUB_OUTPUT

        - name: Configure AWS credentials
          uses: aws-actions/configure-aws-credentials@v6
          with:
            aws-region: eu-west-1
            role-to-assume: ${{ secrets.AWS_ROLE }}

        - name: Pull the docker image on the server
          uses: appleboy/ssh-action@v1
          with:
            host: ${{ secrets.EC2_HOST }}
            username: ${{ secrets.EC2_USER }}
            key: ${{ secrets.EC2_SSH_KEY }}
            envs:
              ECR_NAMESPACE,ECR_REPOSITORY
            script: |
              # 1. Login to ECR (using the instance's IAM role)
              aws ecr get-login-password --region eu-west-1 | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.eu-west-1.amazonaws.com
              
              # 2. Stop and remove the old container (if it exists)
              docker stop $ECR_REPOSITORY || true
              docker rm $ECR_REPOSITORY || true
              
              # 3. Pull the latest image
              docker pull ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.eu-west-1.amazonaws.com/$ECR_NAMESPACE/$ECR_REPOSITORY:latest
              
              # 4. Run the new container
              docker run -d --name $ECR_REPOSITORY -p 40000:40000 -e KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }} ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.eu-west-1.amazonaws.com/$ECR_NAMESPACE/$ECR_REPOSITORY:latest